name: Public SEO V2 Release - Production-Candidate Verification NO DEPLOY
on:
  push:
    branches: [release/seo-v2-public-books-20261101]
permissions:
  contents: read
jobs:
  release-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact approved files and owner-uploaded cover
        run: |
          node <<'NODE'
          const cp=require('child_process'), fs=require('fs');
          const expected=[
            '.github/workflows/release-seo-v2-public-books-20261101.yml',
            'app/books/[slug]/page.tsx','app/books/page.tsx',
            'app/fr/auteurs/page.tsx','app/fr/books/[slug]/page.tsx','app/fr/books/page.tsx',
            'app/lib/featuredStories.ts','app/lib/seoPublishedBooks.ts','app/sitemap.ts',
            'app/writers/page.tsx','components/PublicHomepageV2.tsx',
            'components/SeoPublishedBookPages.tsx','components/SiteFooter.tsx','components/SiteNav.tsx',
            'public/images/covers/ugo-her-pet-dog-flat-2d.webp'
          ].sort();
          const changed=cp.execFileSync('git',['diff','--name-only','618a1f1c6212781834f1eb19f63a18f14cf74347','HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          if(JSON.stringify(changed)!==JSON.stringify(expected))throw Error('Release scope changed: '+JSON.stringify(changed));
          const db=fs.readFileSync('app/lib/seoPublishedBooks.ts','utf8');
          const en=db.split('  en: [')[1].split('\n  ],')[0],fr=db.split('  fr: [')[1].split('\n  ],')[0];
          for (const [loc,body] of [['en',en],['fr',fr]]) {
            if((body.match(/title: /g)||[]).length!==5||(body.match(/id: "ugo-[^"]+"/g)||[]).length!==3)throw Error('Missing titles in '+loc);
            if(!body.includes('Tarllus')||!(loc==='en'?body.includes('Wayfarer'):body.includes('Voyageur')))throw Error('Missing books '+loc);
          }
          for (const match of db.matchAll(/cover: "([^"]+)"/g))if(!fs.existsSync('public'+match[1]))throw Error('Missing book cover '+match[1]);
          const nav=fs.readFileSync('components/SiteNav.tsx','utf8');
          if(!nav.includes('en: "Published books", fr: "Livres publiés"')||!nav.includes('/fr/books/ugo-et-son-petit-chien'))throw Error('Menu or language parity absent');
          const home=fs.readFileSync('components/PublicHomepageV2.tsx','utf8');
          if(!home.includes('publishedCatalogue: "Published books"')||!home.includes('publishedCatalogue: "Livres publiés"'))throw Error('Home discoverability absent');
          console.log('SEO_V2_SCOPE_AND_CONTENT_PASS');
          NODE
          echo '6f32b1a6bdedaa621e219a1ef845e9d416b3f43ed17df0673a659cb77575328c  public/images/covers/ugo-her-pet-dog-flat-2d.webp' | sha256sum -c -
      - name: Reproducible production dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Existing public regression tests
        run: node --test test/*.test.js
      - name: Full production build
        run: npm run build
      - name: Real HTTP canonical, book routes, optimized image and sitemap
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/seo-v2-release-next.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 35); do
            if curl --silent --max-time 3 -o /dev/null http://127.0.0.1:3000/books; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/seo-v2-release-next.log; exit 1; fi
          curl -sSf --max-time 45 'http://127.0.0.1:3000/images/covers/ugo-her-pet-dog-flat-2d.webp' -o /tmp/flat-webp
          echo '6f32b1a6bdedaa621e219a1ef845e9d416b3f43ed17df0673a659cb77575328c  /tmp/flat-webp' | sha256sum -c -
          curl -sSf --max-time 45 'http://127.0.0.1:3000/_next/image?url=%2Fimages%2Fcovers%2Fugo-her-pet-dog-flat-2d.webp&w=256&q=75' -o /tmp/optimized-webp
          test -s /tmp/optimized-webp
          node <<'NODE'
          const assert=require('node:assert/strict');
          const paths=[
            '/books','/fr/books',
            '/books/ugo-and-the-butterfly-woman','/books/ugo-and-her-pet-dog','/books/ugo-and-her-friend-awa',
            '/books/the-trials-of-tarllus','/books/reflections-of-the-wayfarer',
            '/fr/books/ugo-et-la-femme-papillon','/fr/books/ugo-et-son-petit-chien','/fr/books/ugo-et-son-amie-awa',
            '/fr/books/les-epreuves-de-tarllus','/fr/books/reflexions-dun-voyageur'
          ];
          (async()=>{
            for(const path of paths){
              const response=await fetch('http://127.0.0.1:3000'+path);
              const html=await response.text();
              assert.equal(response.status,200,'Route '+path);
              assert(html.includes('rel="canonical"')&&html.includes('<title>'),'Missing metadata '+path);
              if(path!=='/books'&&path!=='/fr/books')assert(html.includes('application/ld+json')&&html.includes('Goddy Oguzie'),'Book data missing '+path);
              if(path==='/books/ugo-and-her-pet-dog'||path==='/books')assert(html.includes('ugo-her-pet-dog-flat-2d.webp'),'Flat cover missing in '+path);
            }
            const sitemap=(await (await fetch('http://127.0.0.1:3000/sitemap.xml')).text());
            for (const path of paths)assert(sitemap.includes('https://www.nextscenes.org'+path),'Missing sitemap '+path);
            for(const path of ['/', '/fr','/books/didie','/fr/books/didie']){
              const response=await fetch('http://127.0.0.1:3000'+path);
              assert.equal(response.status,200,'Existing route '+path);
            }
            console.log('SEO_V2_16_HTTP_ROUTES_AND_IMAGE_PASS');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
