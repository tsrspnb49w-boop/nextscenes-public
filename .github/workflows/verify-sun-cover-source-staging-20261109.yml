name: Verify and refresh approved Kola King cover on staging
on:
  push:
    branches:
      - fix/feature-cards-cover-consistency-20261109
    paths:
      - scripts/find_sun_cover.py
      - .github/workflows/verify-sun-cover-source-staging-20261109.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Fetch only if a matching high-resolution Amazon cover is available
        run: python scripts/find_sun_cover.py
      - name: Commit verified image to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/covers/featured-flat/a-place-in-the-sun.webp
          git diff --cached --quiet || (git commit -m "chore(staging): replace blurred cover with verified full-resolution artwork" && git push)
