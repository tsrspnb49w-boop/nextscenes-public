name: Live Feedback Targeted Replies · Public Candidate
on:
  push:
    branches:
      - candidate/live-feedback-targeted-replies-public-20261031
      - review/navigation-continuity-v1b-public-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/publicCommunityTargetedRepliesV1.test.js
      - run: npm run build
