name: Public Image Delivery V1 - Isolated Acceptance No Deploy
on:
  push:
    branches: [perf/public-image-delivery-v1-20261101]
permissions:
  contents: read
jobs:
  image-performance-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Enforce one-source-file change
        run: |
          node <<'NODE'
          const c=require('node:child_process');
          const changed=c.execFileSync('git',['diff','--name-only','91758724ff2d5de38967490c36e4e3eb00e7123c','HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          const allowed=['components/PublicHomepageV2.tsx','.github/workflows/perf-public-images-v1-20261101.yml'].sort();
          if(JSON.stringify(changed)!==JSON.stringify(allowed))throw Error('Unexpected files: '+JSON.stringify(changed));
          const fs=require('node:fs');
          const f=fs.readFileSync('components/PublicHomepageV2.tsx','utf8');
          const cfg=fs.readFileSync('next.config.ts','utf8');
          if(!f.includes('canOptimizePublicImage')||!f.includes('fetchPriority={i === 1 ? "high" : "auto"}')||!f.includes('loading="eager"'))throw Error('Hero priority/optimizer guard absent');
          for(const host of ['images.unsplash.com','grkvsllcpotylcvbecuj.supabase.co']) if(!cfg.includes(host)||!f.includes(host.replace(/\./g,'\\.')))throw Error('External host mismatch: '+host);
          for(const marker of ['story.cover','mystery.imageSrc','reading.cover'])if(!f.includes('!canOptimizePublicImage('+marker+')'))throw Error('Conservative external fallback absent');
          console.log('PUBLIC_IMAGE_SAFETY_GATE_PASSED');
          NODE
      - name: Reproducible install and production dependency audit
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate
      - name: All existing public regression tests
        run: node --test test/*.test.js
      - name: Complete public site production build
        run: npm run build
      - name: Verify Next image service produces smaller local cover and puzzle files
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/ns-public-start.log 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true' EXIT
          READY=0
          for i in $(seq 1 35); do
            if curl --silent --max-time 3 -o /dev/null http://127.0.0.1:3000/faq; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then cat /tmp/ns-public-start.log; exit 1; fi
          curl --fail --silent --show-error --max-time 50 -o /tmp/optimized-cover -D /tmp/optimized-cover.headers 'http://127.0.0.1:3000/_next/image?url=%2Fimages%2Fcovers%2Ffeatured-flat%2Fugo-her-pet-dog.webp&w=256&q=75'
          curl --fail --silent --show-error --max-time 50 -o /tmp/optimized-puzzle -D /tmp/optimized-puzzle.headers 'http://127.0.0.1:3000/_next/image?url=%2Fimages%2Fmystery250%2Fthe-one-way-footprints.png&w=384&q=75'
          node <<'NODE'
          const fs=require('fs');
          for(const [name,orig,opt] of [
            ['UGO_COVER','public/images/covers/featured-flat/ugo-her-pet-dog.webp','/tmp/optimized-cover'],
            ['MYSTERY_ILLUSTRATION','public/images/mystery250/the-one-way-footprints.png','/tmp/optimized-puzzle']
          ]) {
            const before=fs.statSync(orig).size,after=fs.statSync(opt).size;
            console.log('IMAGE_BYTES_'+name,JSON.stringify({original:before,responsive:after,percentReduction:Math.round(100*(1-after/before))}));
            if(after<=0||after>=before)throw Error(name+' optimizer did not reduce image payload');
          }
          NODE
