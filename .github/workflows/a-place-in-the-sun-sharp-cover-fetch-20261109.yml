name: NextScenes A Place in the Sun - Verified Sharp Cover Retrieval (Staging Only)
on:
  push:
    branches:
      - fix/feature-cards-cover-consistency-20261109
    paths:
      - scripts/find_sun_cover.py
      - .github/workflows/a-place-in-the-sun-sharp-cover-fetch-20261109.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retrieve-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install pillow
      - name: Find and verify original cover at author-supplied Amazon ASIN
        run: python scripts/find_sun_cover.py
      - name: Commit verified high-resolution front cover on staging branch
        run: |
          git config user.name "nextscenes-staging"
          git config user.email "nextscenes-staging@users.noreply.github.com"
          git add public/images/covers/featured-flat/a-place-in-the-sun.webp
          if git diff --cached --quiet; then
            echo "No cover image difference found."
          else
            git commit -m "staging: replace blurry Kola King cover with verified Amazon high-resolution original"
            git push origin HEAD:fix/feature-cards-cover-consistency-20261109
          fi
