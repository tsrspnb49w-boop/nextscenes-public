name: Production Baseline Review · Public Website (No Deploy)
on:
  push:
    branches:
      - review/production-public-feedback-gate-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    name: Existing public website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify current production website builds untouched
        run: npm run build
