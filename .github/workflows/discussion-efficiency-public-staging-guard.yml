name: Discussion Efficiency · Public Staging Compatibility
on:
  push:
    branches:
      - candidate/discussion-efficiency-public-staging-20261030
      - review/navigation-continuity-v1b-public-20261030
      - candidate/staging-samesite-auth-public-v1-20261030
permissions:
  contents: read
jobs:
  focused-public-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/publicCommunityPaginationV1.test.js
      - run: npm run build
