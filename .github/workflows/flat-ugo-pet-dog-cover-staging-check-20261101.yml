name: Staging Flat Ugo Pet Dog Cover - Review Only
on:
  push:
    branches: [fix/staging-flat-ugo-dog-cover-20261101]
permissions:
  contents: read
jobs:
  verify-flat-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Confirm exact user supplied image, scope and links
        shell: bash
        run: |
          test -f public/images/covers/ugo-her-pet-dog-flat-2d.webp
          echo '6f32b1a6bdedaa621e219a1ef845e9d416b3f43ed17df0673a659cb77575328c  public/images/covers/ugo-her-pet-dog-flat-2d.webp' | sha256sum -c -
          test ! -e public/images/ugo-her-pet-dog-flat-2d.webp.webp
          node <<'NODE'
          const fs=require('node:fs');const cp=require('node:child_process');
          const base='0e4d37ab5607b0f54f97e0d7c61d46979740c0fb';
          const got=cp.execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split('\n').sort();
          const expected=['.github/workflows/flat-ugo-pet-dog-cover-staging-check-20261101.yml','app/lib/featuredStories.ts','app/lib/seoPublishedBooks.ts','components/SeoPublishedBookPages.tsx','public/images/covers/ugo-her-pet-dog-flat-2d.webp'].sort();
          if(JSON.stringify(got)!==JSON.stringify(expected))throw Error('Unexpected files: '+JSON.stringify(got));
          const p=fs.readFileSync('app/lib/seoPublishedBooks.ts','utf8');
          const f=fs.readFileSync('app/lib/featuredStories.ts','utf8');
          const c=fs.readFileSync('components/SeoPublishedBookPages.tsx','utf8');
          if(!p.includes('cover: "/images/covers/ugo-her-pet-dog-flat-2d.webp"'))throw Error('Catalogue not updated');
          if(!f.includes('cover: "/images/covers/ugo-her-pet-dog-flat-2d.webp"'))throw Error('Fallback not updated');
          if(!c.includes('book.id === "ugo-dog-en" ? "contain" : "cover"'))throw Error('Other covers should remain unchanged');
          console.log('UGO_FLAT_COVER_SCOPE_AND_CONTENT_PASS');
          NODE
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Existing public site regressions
        run: node --test test/*.test.js
      - name: Complete production build
        run: npm run build
      - name: Check cover can be served and rendered
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/ugo-cover-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 35); do
            if curl -s --max-time 3 -o /dev/null http://127.0.0.1:3000/books; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/ugo-cover-server.log; exit 1; fi
          curl -sSf --max-time 30 'http://127.0.0.1:3000/images/covers/ugo-her-pet-dog-flat-2d.webp' -o /tmp/ugo-served.webp
          echo '6f32b1a6bdedaa621e219a1ef845e9d416b3f43ed17df0673a659cb77575328c  /tmp/ugo-served.webp' | sha256sum -c -
          curl -sSf --max-time 40 'http://127.0.0.1:3000/_next/image?url=%2Fimages%2Fcovers%2Fugo-her-pet-dog-flat-2d.webp&w=256&q=75' -o /tmp/ugo-optimized.webp
          test -s /tmp/ugo-optimized.webp
          curl -sSf --max-time 30 'http://127.0.0.1:3000/books/ugo-and-her-pet-dog' > /tmp/ugo-page.html
          curl -sSf --max-time 30 'http://127.0.0.1:3000/books' > /tmp/ugo-list.html
          grep -q 'ugo-her-pet-dog-flat-2d.webp' /tmp/ugo-page.html
          grep -q 'ugo-her-pet-dog-flat-2d.webp' /tmp/ugo-list.html
          echo 'UGO_FLAT_COVER_HTTP_AND_IMAGE_OPTIMIZATION_PASS'
