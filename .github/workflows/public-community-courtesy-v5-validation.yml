name: V5 Public Community Courtesy validation (no deploy)
on:
  push:
    branches:
      - candidate/public-community-courtesy-v5-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
