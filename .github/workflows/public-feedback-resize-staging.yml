name: Public Live Feedback Resize Staging (No Deploy)
on:
  push:
    branches:
      - candidate/public-live-feedback-resizable-v1-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify original discussion interactions and resize behaviour
        run: node --test test/publicFeedbackResizableV1.test.js
      - name: Typecheck public website
        run: npx tsc --noEmit
      - name: Build public staging (no deployment)
        run: npm run build
