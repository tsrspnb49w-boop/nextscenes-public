name: Public Feedback Pagination Review
on:
  push:
    branches:
      - review/public-feedback-participation-scroll-v1-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-feedback-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/publicCommunityPaginationV1.test.js
      - run: node --test test/publicFeedbackStagingPreflight.test.mjs
      - run: npm run build

  staging-read-only-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/publicFeedbackStagingPreflight.mjs --review
