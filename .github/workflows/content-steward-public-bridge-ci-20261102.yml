name: Content Steward public spotlight bridge CI (no deploy)
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - candidate/content-steward-public-bridge-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --test test/publicEditorialSpotlightBridgeV1.test.js test/publicCommunityCourtesyV1.test.js
      - run: npx tsc --noEmit
      - run: npm run build
